<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>PDF & EPUB Extractor</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 40px auto;
    }

    input,
    button {
      margin-top: 10px;
      width: 100%;
    }

    #driveStatus {
      color: #666;
      font-size: 0.9rem;
      min-height: 1.2em;
    }

    #outline {
      border: 1px solid #ddd;
      padding: 10px;
      max-height: 300px;
      overflow-y: auto;
    }

    #outline li {
      cursor: pointer;
      margin-left: 10px;
    }

    .outline-label {
      cursor: pointer;
    }

    .outline-label:hover {
      text-decoration: underline;
    }


    #outline li.active {
      background: #eef;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <h2>PDF & EPUB Extractor</h2>

  <input type="file" id="bookFile" accept="application/pdf,.epub" />
  <button id="driveBtn" type="button">Choose from Google Drive</button>
  <div id="driveStatus" role="status"></div>
  <input type="text" id="pageRange" placeholder="Page or chapter range (e.g. 2-5)" />
  <button id="extractBtn">Extract & Download</button>
  <h3>Outline</h3>
  <ul id="outline">[outline]</ul>

  <!-- Extraction logic: -->
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="https://accounts.google.com/gsi/client"></script>
  <!-- Outline logic: -->
  <script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  </script>

  <script>
    const { PDFDocument } = PDFLib;
    const GOOGLE_CLIENT_ID = '';
    const GOOGLE_API_KEY = '';
    const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.readonly';
    let driveAccessToken = null;
    let tokenClient = null;
    let pickerReady = false;

    function setDriveStatus(message) {
      document.getElementById('driveStatus').textContent = message;
    }

    function initializeDrive() {
      const driveButton = document.getElementById('driveBtn');
      if (!GOOGLE_CLIENT_ID || !GOOGLE_API_KEY) {
        driveButton.disabled = true;
        setDriveStatus('Add a Google OAuth client ID and API key in the script to enable Drive.');
        return;
      }

      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: DRIVE_SCOPE,
        callback: tokenResponse => {
          if (tokenResponse.error) {
            setDriveStatus('Google Drive authorization was cancelled.');
            return;
          }
          driveAccessToken = tokenResponse.access_token;
          createDrivePicker();
        }
      });

      gapi.load('picker', () => {
        pickerReady = true;
        driveButton.disabled = false;
      });
    }

    function createDrivePicker() {
      const view = new google.picker.View(google.picker.ViewId.DOCS);
      view.setMimeTypes('application/pdf,application/epub+zip');
      const picker = new google.picker.PickerBuilder()
        .setDeveloperKey(GOOGLE_API_KEY)
        .setAppId(GOOGLE_CLIENT_ID.split('.')[0])
        .setOAuthToken(driveAccessToken)
        .addView(view)
        .setCallback(handleDriveSelection)
        .build();
      picker.setVisible(true);
    }

    async function handleDriveSelection(data) {
      if (data.action !== google.picker.Action.PICKED) return;

      const selected = data.docs[0];
      setDriveStatus(`Downloading ${selected.name}...`);
      try {
        const response = await fetch(
          `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(selected.id)}?alt=media`,
          { headers: { Authorization: `Bearer ${driveAccessToken}` } }
        );
        if (!response.ok) throw new Error(`Drive returned ${response.status}.`);

        const blob = await response.blob();
        const file = new File([blob], selected.name, { type: selected.mimeType });
        const dataTransfer = new DataTransfer();
        dataTransfer.items.add(file);
        document.getElementById('bookFile').files = dataTransfer.files;
        document.getElementById('bookFile').dispatchEvent(new Event('change'));
        setDriveStatus(`Selected ${selected.name}`);
      } catch (error) {
        setDriveStatus(`Could not download the Drive file: ${error.message}`);
      }
    }

    document.getElementById('driveBtn').addEventListener('click', () => {
      if (!pickerReady) return;
      setDriveStatus('Connecting to Google Drive...');
      tokenClient.requestAccessToken({ prompt: driveAccessToken ? '' : 'consent' });
    });

    if (window.google?.accounts?.oauth2) initializeDrive();

    async function extractPdf(file, start, end) {
      const bytes = await file.arrayBuffer();
      const srcPdf = await PDFDocument.load(bytes);
      const newPdf = await PDFDocument.create();
      const pageCount = srcPdf.getPageCount();

      if (end > pageCount) {
        alert(`PDF only has ${pageCount} pages`);
        return;
      }

      const pages = await newPdf.copyPages(
        srcPdf,
        Array.from({ length: end - start + 1 }, (_, i) => start - 1 + i)
      );
      pages.forEach(p => newPdf.addPage(p));

      const newBytes = await newPdf.save();
      const blob = new Blob([newBytes], { type: 'application/pdf' });
      downloadBlob(blob, `${file.name.replace(/\.pdf$/i, '')}-${start}-${end}.pdf`);
    }

    async function extractEpub(file, start, end) {
      const zip = await JSZip.loadAsync(await file.arrayBuffer());
      const container = parseXml(await zip.file('META-INF/container.xml').async('text'));
      const rootfile = container.querySelector('rootfile');
      if (!rootfile) throw new Error('The EPUB package file could not be found.');

      const opfPath = rootfile.getAttribute('full-path');
      const opf = parseXml(await zip.file(opfPath).async('text'));
      const spine = opf.querySelector('spine');
      if (!spine) throw new Error('The EPUB spine could not be found.');
      const itemrefs = [...spine.querySelectorAll(':scope > itemref')];
      if (!itemrefs.length || end > itemrefs.length) {
        alert(`EPUB only has ${itemrefs.length} chapters`);
        return;
      }

      const selectedIds = new Set(itemrefs.slice(start - 1, end).map(ref => ref.getAttribute('idref')));
      itemrefs.forEach(ref => {
        if (!selectedIds.has(ref.getAttribute('idref'))) ref.remove();
      });

      zip.file(opfPath, new XMLSerializer().serializeToString(opf));
      const output = await zip.generateAsync({ type: 'blob', mimeType: 'application/epub+zip' });
      downloadBlob(output, `${file.name.replace(/\.epub$/i, '')}-${start}-${end}.epub`);
    }

    function parseXml(text) {
      const xml = new DOMParser().parseFromString(text, 'application/xml');
      if (xml.querySelector('parsererror')) throw new Error('The EPUB contains invalid XML.');
      return xml;
    }

    function downloadBlob(blob, name) {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = name;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    document.getElementById('extractBtn').addEventListener('click', async () => {
      const fileInput = document.getElementById('bookFile');
      const rangeInput = document.getElementById('pageRange').value;

      if (!fileInput.files.length) {
        alert('Please upload a PDF or EPUB');
        return;
      }

      const match = rangeInput.match(/^(\d+)(?:\s*-\s*(\d+))?$/);
      if (!match) {
        alert('Invalid page range');
        return;
      }

      let [_, start, end] = match;
      start = parseInt(start, 10);
      end = end ? parseInt(end, 10) : start;

      if (start > end || start < 1) {
        alert('Invalid page numbers');
        return;
      }

      const file = fileInput.files[0];
      try {
        if (/\.epub$/i.test(file.name)) {
          await extractEpub(file, start, end);
        } else {
          await extractPdf(file, start, end);
        }
      } catch (error) {
        alert(`Could not extract the file: ${error.message}`);
      }
    });
  </script>

  <script>
    async function flattenOutline(items, pdf, depth = 0, result = []) {
      for (const item of items) {
        if (item.dest) {
          let destArray =
            typeof item.dest === 'string'
              ? await pdf.getDestination(item.dest)
              : item.dest;

          if (destArray[0]) {
            const pageIndex = await pdf.getPageIndex(destArray[0]);
            result.push({
              title: item.title,
              page: pageIndex + 1,
              depth
            });
          }
        }

        if (item.items?.length) {
          await flattenOutline(item.items, pdf, depth + 1, result);
        }
      }
      return result;
    }

    async function renderOutline(items, parent, depth = 0) {
      for (const item of items) {
        const li = document.createElement('li');

        li.addEventListener('click', async (e) => {
          e.stopPropagation();
          if (!item.dest) return;

          let destArray;

          if (typeof item.dest === 'string') {
            destArray = await loadedPdf.getDestination(item.dest);
          } else {
            destArray = item.dest;
          }

          if (!destArray) return;

          const pageIndex = await loadedPdf.getPageIndex(destArray[0]);

          const startPage = pageIndex + 1;
          const thisDepth = depth;

          const currentIndex = flatOutline.findIndex(
            o => o.page === startPage && o.depth === thisDepth
          );

          let endPage = loadedPdf.numPages;
          for (let i = currentIndex + 1; i < flatOutline.length; i++) {
            if (flatOutline[i].depth === thisDepth) {
              endPage = flatOutline[i].page - 0;
              break;
            }
          }

          const rangeInput = document.getElementById('pageRange');
          rangeInput.value =
            startPage === endPage
              ? `${startPage}`
              : `${startPage}-${endPage}`; 
        });

        parent.appendChild(li);
        const label = document.createElement('span');
        label.textContent = item.title;
        label.className = 'outline-label';
        li.appendChild(label);


        if (item.items && item.items.length) {
          const ul = document.createElement('ul');
          li.appendChild(ul);
          await renderOutline(item.items, ul, depth + 1);
        }
      }
    }

    let flatOutline = [];
    let loadedPdf = null;

    async function loadOutline(file) {
      if (/\.epub$/i.test(file.name)) {
        await loadEpubOutline(file);
        return;
      }

      const buffer = await file.arrayBuffer();
      loadedPdf = await pdfjsLib.getDocument({ data: buffer }).promise;

      const outline = await loadedPdf.getOutline();
      const outlineEl = document.getElementById('outline');
      outlineEl.innerHTML = '';

      if (!outline) {
        outlineEl.innerHTML = '<li>No outline found</li>';
        return;
      }

      flatOutline = await flattenOutline(outline, loadedPdf);

      await renderOutline(outline, outlineEl);
    }

    async function loadEpubOutline(file) {
      const zip = await JSZip.loadAsync(await file.arrayBuffer());
      const container = parseXml(await zip.file('META-INF/container.xml').async('text'));
      const rootfile = container.querySelector('rootfile');
      if (!rootfile) throw new Error('The EPUB package file could not be found.');

      const opf = parseXml(await zip.file(rootfile.getAttribute('full-path')).async('text'));
      const spine = opf.querySelector('spine');
      if (!spine) throw new Error('The EPUB spine could not be found.');

      const items = [...spine.querySelectorAll(':scope > itemref')];
      const outlineEl = document.getElementById('outline');
      outlineEl.innerHTML = '';
      flatOutline = items.map((item, index) => ({
        title: item.getAttribute('idref'),
        page: index + 1,
        depth: 0
      }));

      items.forEach((item, index) => {
        const li = document.createElement('li');
        li.textContent = `Chapter ${index + 1} (${item.getAttribute('idref')})`;
        li.addEventListener('click', () => {
          document.getElementById('pageRange').value = `${index + 1}`;
        });
        outlineEl.appendChild(li);
      });
    }

    document.getElementById('bookFile').addEventListener('change', (e) => {
      if (e.target.files.length) {
        loadOutline(e.target.files[0]).catch(error => {
          alert(`Could not read the file: ${error.message}`);
        });
      }
    });
  </script>


</body>

</html>
